name: AI CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  backend-test:

    runs-on: ubuntu-latest

    steps:

      # =======================================================
      # 1. CHECKOUT REPOSITORY
      # =======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =======================================================
      # 2. SETUP PYTHON
      # =======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      # =======================================================
      # 3. START PIPELINE TIMER
      # =======================================================

      - name: Start pipeline timer
        run: |
          echo "PIPELINE_START=$(date +%s)" >> "$GITHUB_ENV"


      # =======================================================
      # 4. INSTALL BACKEND DEPENDENCIES
      # =======================================================

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # =======================================================
      # 5. RUN PYTEST + RESOURCE MONITORING
      # =======================================================

      - name: Run backend tests
        id: tests
        working-directory: backend
        run: |
          set +e

          /usr/bin/time -v \
            -o test-resource.txt \
            python -m pytest \
            --junitxml=pytest-results.xml

          TEST_EXIT_CODE=$?

          echo "exit_code=$TEST_EXIT_CODE" >> "$GITHUB_OUTPUT"

          exit 0


      # =======================================================
      # 6. TRIVY READABLE SECURITY SCAN
      # =======================================================

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM,LOW
          format: table
          exit-code: 0


      # =======================================================
      # 7. GENERATE TRIVY JSON REPORT
      # =======================================================

      - name: Generate Trivy JSON report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM,LOW
          format: json
          output: trivy-results.json
          exit-code: 0


      # =======================================================
      # 8. SEND SECURITY REPORT TO FASTAPI
      # =======================================================

      - name: Send security report to dashboard backend
        if: always()

        env:
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}

        run: |
          if [ -z "$BACKEND_API_URL" ]; then
            echo "BACKEND_API_URL secret is not configured."
            exit 1
          fi

          if [ ! -f "trivy-results.json" ]; then
            echo "Trivy report was not generated."
            exit 1
          fi

          echo "Sending Trivy report to backend..."

          curl \
            --fail-with-body \
            --retry 3 \
            --retry-delay 5 \
            --max-time 90 \
            -X POST \
            "$BACKEND_API_URL/api/security/analyze" \
            -F "file=@trivy-results.json"

          echo ""
          echo "Security report sent successfully."


      # =======================================================
      # 9. UPLOAD TRIVY REPORT AS GITHUB ARTIFACT
      # =======================================================

      - name: Upload Trivy security report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: trivy-security-report
          path: trivy-results.json
          if-no-files-found: warn


      # =======================================================
      # 10. COLLECT REAL CI METRICS
      # =======================================================

      - name: Collect CI metrics
        id: metrics
        if: always()

        env:
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}

        run: |
          python <<'PY'
          import json
          import os
          import re
          import time
          import xml.etree.ElementTree as ET


          # ---------------------------------------------------
          # BUILD / PIPELINE TIME
          # ---------------------------------------------------

          start_time = int(
              os.environ.get(
                  "PIPELINE_START",
                  str(int(time.time()))
              )
          )

          build_time = max(
              0,
              int(time.time()) - start_time
          )


          # ---------------------------------------------------
          # PYTEST RESULTS
          # ---------------------------------------------------

          tests_passed = 0
          tests_failed = 0

          junit_path = "backend/pytest-results.xml"

          if os.path.exists(junit_path):

              root = ET.parse(
                  junit_path
              ).getroot()

              if root.tag == "testsuite":
                  suites = [root]

              else:
                  suites = root.findall(
                      ".//testsuite"
                  )

              total = 0
              failures = 0
              errors = 0
              skipped = 0

              for suite in suites:

                  total += int(
                      suite.attrib.get(
                          "tests",
                          0
                      )
                  )

                  failures += int(
                      suite.attrib.get(
                          "failures",
                          0
                      )
                  )

                  errors += int(
                      suite.attrib.get(
                          "errors",
                          0
                      )
                  )

                  skipped += int(
                      suite.attrib.get(
                          "skipped",
                          0
                      )
                  )

              tests_failed = (
                  failures + errors
              )

              tests_passed = max(
                  0,
                  total
                  - failures
                  - errors
                  - skipped
              )


          # ---------------------------------------------------
          # CPU + MEMORY
          # ---------------------------------------------------

          cpu_usage = 0.0
          memory_usage = 0.0

          resource_path = (
              "backend/test-resource.txt"
          )

          if os.path.exists(
              resource_path
          ):

              with open(
                  resource_path,
                  "r",
                  encoding="utf-8"
              ) as resource_file:

                  text = (
                      resource_file.read()
                  )


              cpu_match = re.search(
                  r"Percent of CPU this job got:\s*([\d.]+)%",
                  text
              )

              if cpu_match:

                  cpu_usage = min(
                      100.0,
                      float(
                          cpu_match.group(1)
                      )
                  )


              memory_match = re.search(
                  r"Maximum resident set size \(kbytes\):\s*(\d+)",
                  text
              )

              if memory_match:

                  memory_kb = int(
                      memory_match.group(1)
                  )

                  memory_usage = round(
                      memory_kb / 1024,
                      2
                  )


          # ---------------------------------------------------
          # TRIVY VULNERABILITY COUNTS
          # ---------------------------------------------------

          vulnerabilities = 0

          critical_count = 0
          high_count = 0
          medium_count = 0
          low_count = 0

          trivy_path = (
              "trivy-results.json"
          )

          if os.path.exists(
              trivy_path
          ):

              with open(
                  trivy_path,
                  "r",
                  encoding="utf-8"
              ) as trivy_file:

                  report = json.load(
                      trivy_file
                  )


              for result in report.get(
                  "Results",
                  []
              ):

                  for vulnerability in (
                      result.get(
                          "Vulnerabilities"
                      )
                      or []
                  ):

                      vulnerabilities += 1

                      severity = str(
                          vulnerability.get(
                              "Severity",
                              ""
                          )
                      ).upper()


                      if severity == "CRITICAL":

                          critical_count += 1

                      elif severity == "HIGH":

                          high_count += 1

                      elif severity == "MEDIUM":

                          medium_count += 1

                      elif severity == "LOW":

                          low_count += 1


          # ---------------------------------------------------
          # TEST EXIT CODE
          # ---------------------------------------------------

          raw_test_exit_code = (
              os.environ.get(
                  "TEST_EXIT_CODE",
                  "1"
              )
          )

          try:

              test_exit_code = int(
                  raw_test_exit_code
                  if raw_test_exit_code
                  else "1"
              )

          except ValueError:

              test_exit_code = 1


          # ---------------------------------------------------
          # PIPELINE STATUS
          #
          # FAIL IF:
          # - PYTEST FAILS
          # - CRITICAL VULNERABILITY EXISTS
          # ---------------------------------------------------

          if (
              test_exit_code != 0
              or critical_count > 0
          ):

              status = "failed"

          else:

              status = "success"


          # ---------------------------------------------------
          # SAVE GITHUB OUTPUTS
          # ---------------------------------------------------

          github_output = (
              os.environ[
                  "GITHUB_OUTPUT"
              ]
          )

          with open(
              github_output,
              "a",
              encoding="utf-8"
          ) as output:

              output.write(
                  f"status={status}\n"
              )

              output.write(
                  f"build_time={build_time}\n"
              )

              output.write(
                  f"tests_passed={tests_passed}\n"
              )

              output.write(
                  f"tests_failed={tests_failed}\n"
              )

              output.write(
                  f"cpu_usage={cpu_usage}\n"
              )

              output.write(
                  f"memory_usage={memory_usage}\n"
              )

              output.write(
                  f"vulnerabilities={vulnerabilities}\n"
              )

              output.write(
                  f"critical_count={critical_count}\n"
              )

              output.write(
                  f"high_count={high_count}\n"
              )

              output.write(
                  f"medium_count={medium_count}\n"
              )

              output.write(
                  f"low_count={low_count}\n"
              )


          # ---------------------------------------------------
          # DISPLAY RESULTS
          # ---------------------------------------------------

          print(
              "======================================"
          )

          print(
              "CI METRICS"
          )

          print(
              "======================================"
          )

          print(
              "Pipeline status:",
              status
          )

          print(
              "Build time:",
              build_time,
              "seconds"
          )

          print(
              "Tests passed:",
              tests_passed
          )

          print(
              "Tests failed:",
              tests_failed
          )

          print(
              "CPU usage:",
              cpu_usage,
              "%"
          )

          print(
              "Memory usage:",
              memory_usage,
              "MB"
          )

          print(
              "Vulnerabilities:",
              vulnerabilities
          )

          print(
              "Critical:",
              critical_count
          )

          print(
              "High:",
              high_count
          )

          print(
              "Medium:",
              medium_count
          )

          print(
              "Low:",
              low_count
          )

          print(
              "======================================"
          )

          PY


      # =======================================================
      # 11. AUTOMATIC ML FAILURE PREDICTION
      # =======================================================

      - name: Run AI failure prediction
        if: always()

        env:
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}

          BUILD_TIME: ${{ steps.metrics.outputs.build_time }}

          TESTS_FAILED: ${{ steps.metrics.outputs.tests_failed }}

          CPU_USAGE: ${{ steps.metrics.outputs.cpu_usage }}

          MEMORY_USAGE: ${{ steps.metrics.outputs.memory_usage }}

          VULNERABILITIES: ${{ steps.metrics.outputs.vulnerabilities }}

        run: |
          if [ -z "$BACKEND_API_URL" ]; then
            echo "BACKEND_API_URL secret is not configured."
            exit 1
          fi

          if [ -z "$BUILD_TIME" ]; then
            echo "CI metrics are missing."
            exit 1
          fi


          cat > prediction-payload.json <<EOF
          {
            "build_time": $BUILD_TIME,
            "tests_failed": $TESTS_FAILED,
            "cpu_usage": $CPU_USAGE,
            "memory_usage": $MEMORY_USAGE,
            "vulnerabilities": $VULNERABILITIES
          }
          EOF


          echo "Sending metrics to AI prediction API:"

          cat prediction-payload.json


          curl \
            --fail-with-body \
            --retry 3 \
            --retry-delay 5 \
            --max-time 90 \
            -X POST \
            "$BACKEND_API_URL/api/predict" \
            -H "Content-Type: application/json" \
            --data @prediction-payload.json


          echo ""

          echo "AI prediction completed successfully."

      # =======================================================
      # 12. AUTOMATIC CODE COMPLEXITY ANALYSIS
      # =======================================================

      - name: Run automatic code complexity analysis
        if: always()

        env:
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}

        run: |
          if [ -z "$BACKEND_API_URL" ]; then
            echo "BACKEND_API_URL secret is not configured."
            exit 1
          fi

          echo "Analyzing backend Python files..."

          FILES=(
            "backend/app/complexity.py"
            "backend/app/performance.py"
            "backend/app/security.py"
            "backend/app/predictor.py"
            "backend/app/main.py"
            "backend/samples/risky_demo.py"
          )
            
        

          for FILE in "${FILES[@]}"; do

            if [ -f "$FILE" ]; then

              echo ""
              echo "Analyzing: $FILE"

              curl \
                --fail-with-body \
                --retry 3 \
                --retry-delay 5 \
                --max-time 90 \
                -X POST \
                "$BACKEND_API_URL/api/analyze/upload" \
                -F "file=@$FILE"

              echo ""

            else

              echo "File not found: $FILE"

            fi

          done

          echo "Complexity analysis completed successfully."
      # =======================================================
      # 13. SEND PIPELINE METRICS TO FASTAPI
      # =======================================================

      - name: Send CI result to dashboard backend
        if: always()

        env:
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}

          PIPELINE_STATUS: ${{ steps.metrics.outputs.status }}

          BUILD_TIME: ${{ steps.metrics.outputs.build_time }}

          TESTS_PASSED: ${{ steps.metrics.outputs.tests_passed }}

          TESTS_FAILED: ${{ steps.metrics.outputs.tests_failed }}

          CPU_USAGE: ${{ steps.metrics.outputs.cpu_usage }}

          MEMORY_USAGE: ${{ steps.metrics.outputs.memory_usage }}

          VULNERABILITIES: ${{ steps.metrics.outputs.vulnerabilities }}

        run: |
          if [ -z "$BACKEND_API_URL" ]; then
            echo "BACKEND_API_URL secret is not configured."
            exit 1
          fi

          if [ -z "$PIPELINE_STATUS" ]; then
            echo "CI metrics were not generated."
            exit 1
          fi


          cat > ci-payload.json <<EOF
          {
            "pipeline_id": ${{ github.run_id }},
            "status": "$PIPELINE_STATUS",
            "build_time": $BUILD_TIME,
            "tests_passed": $TESTS_PASSED,
            "tests_failed": $TESTS_FAILED,
            "cpu_usage": $CPU_USAGE,
            "memory_usage": $MEMORY_USAGE,
            "vulnerabilities": $VULNERABILITIES
          }
          EOF


          echo "Sending CI payload:"

          cat ci-payload.json


          curl \
            --fail-with-body \
            --retry 3 \
            --retry-delay 5 \
            --max-time 90 \
            -X POST \
            "$BACKEND_API_URL/api/ci/report" \
            -H "Content-Type: application/json" \
            --data @ci-payload.json


          echo ""

          echo "Pipeline metrics sent successfully."


      # =======================================================
      # 13. FINAL DEPLOYMENT GATE
      # =======================================================

      - name: CI deployment gate
        if: always()

        env:
          PIPELINE_STATUS: ${{ steps.metrics.outputs.status }}

        run: |
          echo "Final pipeline status: $PIPELINE_STATUS"


          if [ -z "$PIPELINE_STATUS" ]; then

            echo "Pipeline status could not be determined."

            echo "Deployment blocked."

            exit 1

          fi


          if [ "$PIPELINE_STATUS" = "failed" ]; then

            echo "Tests failed or critical vulnerabilities were detected."

            echo "Deployment blocked."

            exit 1

          fi


          echo "Deployment allowed."