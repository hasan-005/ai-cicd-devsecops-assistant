name: AI CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  backend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: |
          python -m pytest

      # Full security scan
      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM,LOW
          format: table
          exit-code: 0

      # Generate machine-readable JSON report
      - name: Generate Trivy JSON report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM,LOW
          format: json
          output: trivy-results.json
          exit-code: 0

      # Save JSON report as GitHub artifact
      - name: Upload Trivy security report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-results.json

      # Deployment security gate
      - name: Security deployment gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL
          format: table
          exit-code: 1
      - name: Send CI result to dashboard backend
        if: always()
        env:
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}
        run: |
          if [ -z "$BACKEND_API_URL" ]; then
            echo "BACKEND_API_URL secret is not configured."
            exit 0
          fi

          curl -X POST "$BACKEND_API_URL/api/ci/report" \
            -H "Content-Type: application/json" \
            -d '{
              "pipeline_id": ${{ github.run_id }},
              "status": "${{ job.status }}",
              "build_time": 0,
              "tests_passed": 0,
              "tests_failed": 0,
              "cpu_usage": 0,
              "memory_usage": 0,
              "vulnerabilities": 0
            }'